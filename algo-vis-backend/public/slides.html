<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoShowMaker Slides</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/reveal/reset.css" />
  <link rel="stylesheet" href="/vendor/reveal/reveal.css" />
  <link rel="stylesheet" href="/vendor/reveal/theme/white.css" />
  <link rel="stylesheet" href="/vendor/reveal/plugin/highlight/monokai.css" />
  <link rel="stylesheet" href="slides.css?v=random-id-39" />
</head>

<body class="asm-edit-mode">
  <aside id="controlChrome" class="control-chrome" aria-label="控制欄">
    <div class="mode-switch" aria-label="模式切換">
      <button id="modeToggleBtn" type="button" title="切換至 Present 模式" aria-label="切換至 Present 模式">
        <svg class="mode-toggle-icon mode-icon-edit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h16v15H4z" />
          <path d="M7 16l1.1-3.6 7.4-7.4 2.5 2.5-7.4 7.4zM14.2 6.3l2.5 2.5" />
        </svg>
        <svg class="mode-toggle-icon mode-icon-present" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 3h16v10H4zM8 7h8" />
          <path d="M9 16h6l1 5H8zM12 13v3" />
        </svg>
      </button>
    </div>
  </aside>

  <aside id="editorChrome" class="editor-chrome" aria-label="投影片元件">
    <div id="defaultToolPanel" class="sidebar-panel">
    <button type="button" class="palette-item tool-text" draggable="true" data-tool="text" title="text">
      <span class="tool-icon">T</span>
      <span>text</span>
    </button>

    <div class="shape-tool">
      <button id="shapeMenuBtn" type="button" class="palette-item tool-shape" title="Shapes">
        <span class="shape-stack" aria-hidden="true">
          <span class="shape-circle"></span>
          <span class="shape-triangle"></span>
        </span>
        <span>shapes</span>
      </button>
      <div id="shapeMenu" class="shape-menu" hidden>
        <button type="button" class="shape-choice shape-choice-rect" draggable="true" data-tool="shape" data-shape="rect" title="矩形">□</button>
        <button type="button" class="shape-choice" draggable="true" data-tool="shape" data-shape="circle" title="圓形">○</button>
        <button type="button" class="shape-choice" draggable="true" data-tool="shape" data-shape="triangle" title="三角形">△</button>
      </div>
    </div>

    <button type="button" class="palette-item tool-latex" draggable="true" data-tool="latex" title="LaTeX 公式">
      <span class="tool-icon">Σ</span>
      <span>LaTeX</span>
    </button>

    <button type="button" class="palette-item tool-code" draggable="true" data-tool="code" title="C++ 程式碼">
      <span class="tool-icon">{}</span>
      <span>code</span>
    </button>

    <button id="algorithmEditSlideBtn" type="button" class="palette-item algorithm-edit-sidebar-action" hidden>
      <span class="tool-icon">{;}</span>
      <span>編輯演算法動畫</span>
    </button>
    </div>

    <div id="overviewSidebarPanel" class="sidebar-panel overview-sidebar-panel" hidden>
      <button id="overviewAddSlideBtn" type="button" class="palette-item overview-action">
        <span class="tool-icon">+</span>
        <span>新增投影片</span>
      </button>
      <button id="overviewAddAlgorithmSlideBtn" type="button" class="palette-item overview-action overview-algorithm-action">
        <span class="tool-icon">{;}</span>
        <span>新增演算法動畫投影片</span>
      </button>
    </div>

    <div id="latexEditorPanel" class="sidebar-panel widget-editor-panel" hidden>
      <div class="panel-title">
        <strong>LaTeX</strong>
        <button id="exitLatexEditorBtn" type="button" title="退出">×</button>
      </div>
      <label class="field-label" for="latexFontSizeInput">字體大小</label>
      <input id="latexFontSizeInput" type="number" min="12" max="160" value="34" />
      <textarea id="latexEditorInput" spellcheck="false"></textarea>
      <div class="symbol-grid" aria-label="常用符號">
        <button type="button" data-insert="\frac{}{}">\frac</button>
        <button type="button" data-insert="\sqrt{}">\sqrt</button>
        <button type="button" data-insert="\sum_{i=1}^{n}">Σ</button>
        <button type="button" data-insert="\int_{}^{}">∫</button>
        <button type="button" data-insert="\alpha">α</button>
        <button type="button" data-insert="\beta">β</button>
        <button type="button" data-insert="\theta">θ</button>
        <button type="button" data-insert="\pi">π</button>
        <button type="button" data-insert="\leq">≤</button>
        <button type="button" data-insert="\geq">≥</button>
        <button type="button" data-insert="\neq">≠</button>
        <button type="button" data-insert="\rightarrow">→</button>
      </div>
    </div>

    <div id="codeEditorPanel" class="sidebar-panel widget-editor-panel" hidden>
      <div class="panel-title">
        <strong>code</strong>
        <button id="exitCodeEditorBtn" type="button" title="退出">×</button>
      </div>
      <select id="codeLanguageSelect" title="程式語言">
        <option value="cpp">C++</option>
        <option value="c">C</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="plaintext">Plain text</option>
      </select>
      <label class="field-label" for="codeFontSizeInput">字體大小</label>
      <input id="codeFontSizeInput" type="number" min="10" max="80" value="21" />
      <label class="field-label" for="codeFocusLinesInput">關注的行數</label>
      <input id="codeFocusLinesInput" type="text" placeholder="例如：1,3-5" />
      <label class="check-field" for="codeShowLineNumbersInput">
        <input id="codeShowLineNumbersInput" type="checkbox" />
        <span>顯示行號</span>
      </label>
      <button id="openCodeEditorBtn" class="code-editor-open-btn" type="button">編輯程式碼</button>
    </div>

    <div id="animationEditorPanel" class="sidebar-panel animation-editor-panel" hidden>
      <div id="shapeEditorControls" class="shape-editor-controls" hidden>
        <div class="shape-editor-title">Shape</div>
        <div class="shape-editor-grid">
          <button type="button" class="shape-choice shape-choice-rect" data-shape-choice="rect" title="矩形" aria-label="矩形">□</button>
          <button type="button" class="shape-choice" data-shape-choice="circle" title="圓形" aria-label="圓形">○</button>
          <button type="button" class="shape-choice" data-shape-choice="triangle" title="三角形" aria-label="三角形">△</button>
        </div>
      </div>
      <div id="layerEditorControls" class="layer-editor-controls">
        <div class="layer-editor-title">圖層順序</div>
        <div class="layer-action-grid">
          <button id="layerToTopBtn" type="button" class="layer-action-btn" title="移到最上面" aria-label="移到最上面">
            <span class="layer-icon layer-icon-to-top" aria-hidden="true"></span>
          </button>
          <button id="layerUpBtn" type="button" class="layer-action-btn" title="往上移一層" aria-label="往上移一層">
            <span class="layer-icon layer-icon-up" aria-hidden="true"></span>
          </button>
          <button id="layerDownBtn" type="button" class="layer-action-btn" title="往下移一層" aria-label="往下移一層">
            <span class="layer-icon layer-icon-down" aria-hidden="true"></span>
          </button>
          <button id="layerToBottomBtn" type="button" class="layer-action-btn" title="移到最下面" aria-label="移到最下面">
            <span class="layer-icon layer-icon-to-bottom" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div class="panel-title">
        <strong>動畫設定</strong>
      </div>
      <label class="field-label" for="transitionIdInput">Transition ID</label>
      <input id="transitionIdInput" type="text" placeholder="跨投影片對應 ID" />
      <label class="check-field" for="fragmentEnabledInput">
        <input id="fragmentEnabledInput" type="checkbox" />
        <span>使用 Fragment 動畫</span>
      </label>
      <label class="field-label" for="fragmentStyleSelect">動畫效果</label>
      <select id="fragmentStyleSelect">
        <option value="">淡入</option>
        <option value="fade-out">淡出</option>
        <option value="fade-up">向上淡入</option>
        <option value="fade-down">向下淡入</option>
        <option value="fade-left">向左淡入</option>
        <option value="fade-right">向右淡入</option>
        <option value="grow">放大</option>
        <option value="shrink">縮小</option>
        <option value="zoom-in">縮放淡入</option>
        <option value="current-visible">僅目前步驟顯示</option>
      </select>
      <label class="field-label" for="fragmentIndexInput">動畫順序</label>
      <input id="fragmentIndexInput" type="number" min="0" placeholder="留白則自動排序" />
    </div>
  </aside>

  <div id="overviewChrome" class="overview-chrome" hidden>
    <button id="addSlideBtn" type="button">新增投影片</button>
    <span id="overviewHint"></span>
  </div>

  <div id="editHint" class="edit-hint">ESC 開啟 overview，可拖曳排序投影片。</div>

  <div id="customOverview" class="custom-overview" hidden>
    <div id="customOverviewViewport" class="custom-overview-viewport">
      <div id="customOverviewBoard" class="custom-overview-board"></div>
    </div>
  </div>

  <div id="algorithmEditorModal" class="algorithm-editor-modal" hidden>
    <div class="algorithm-editor-dialog">
      <div class="algorithm-editor-header">
        <div>
          <strong>演算法動畫投影片</strong>
          <span id="algorithmEditorStatus">編譯成功後，動畫腳本會儲存在這張投影片中。</span>
        </div>
        <button id="saveAlgorithmEditorBtn" type="button" title="將目前腳本儲存到投影片">儲存</button>
      </div>
      <iframe id="algorithmEditorFrame" title="演算法動畫編輯器" src="about:blank"></iframe>
    </div>
  </div>

  <div id="codeEditorModal" class="code-editor-modal" hidden>
    <div class="code-editor-dialog">
      <div class="code-editor-header">
        <div>
          <strong>編輯程式碼</strong>
          <span id="codeEditorModalStatus">使用 ACE editor 編輯目前 code 物件</span>
        </div>
        <div class="code-editor-modal-actions">
          <button id="closeCodeEditorModalBtn" type="button">取消</button>
          <button id="saveCodeEditorModalBtn" type="button">儲存</button>
        </div>
      </div>
      <div id="codeAceEditor" class="code-ace-editor"></div>
    </div>
  </div>

  <div id="objectToolbar" class="object-toolbar" hidden>
    <select id="fontFamilySelect" title="字體">
      <option value="Segoe UI">Segoe UI</option>
      <option value="Noto Sans TC">Noto Sans TC</option>
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Consolas">Consolas</option>
    </select>
    <input id="fontSizeInput" type="number" min="8" max="160" value="34" title="字體大小" />
    <button id="boldBtn" type="button" title="粗體"><strong>B</strong></button>
    <button id="italicBtn" type="button" title="斜體"><em>I</em></button>
    <button id="underlineBtn" type="button" title="底線"><u>U</u></button>
    <button id="strikeBtn" type="button" title="刪除線"><s>S</s></button>
    <button id="alignLeftBtn" type="button" title="靠左"><span class="align-icon align-left-icon"></span></button>
    <button id="alignCenterBtn" type="button" title="置中"><span class="align-icon align-center-icon"></span></button>
    <button id="alignRightBtn" type="button" title="靠右"><span class="align-icon align-right-icon"></span></button>
    <button id="listStyleBtn" type="button" title="項目符號 / 編號">• / 1.</button>
    <button id="textColorBtn" type="button" title="文字顏色">A</button>
    <button id="bgColorBtn" type="button" title="文字背景色"><span class="text-bg-icon">A</span></button>
    <button id="shapeStrokeBtn" class="shape-style-btn" type="button" title="邊框顏色、粗細與圓弧度">
      <span class="shape-corner-icon shape-stroke-icon"></span>
    </button>
    <button id="shapeColorBtn" class="shape-style-btn" type="button" title="底框顏色">
      <span class="shape-corner-icon shape-fill-icon"></span>
    </button>
    <div id="iroPopup" class="iro-popup" hidden>
      <div id="iroPicker"></div>
      <div id="shapeStyleControls" class="shape-style-controls" hidden>
        <label class="shape-style-label" for="shapeStrokeWidthInput">
          <span>邊框粗細</span>
          <output id="shapeStrokeWidthValue">4</output>
        </label>
        <input id="shapeStrokeWidthInput" class="shape-standard-slider" type="range" min="0" max="20" step="1" value="4" />
        <div id="shapeCornerRadiusControls" class="shape-corner-radius-controls">
          <label class="shape-style-label" for="shapeCornerRadiusInput">
            <span>邊角圓弧度</span>
            <output id="shapeCornerRadiusValue">0</output>
          </label>
          <input id="shapeCornerRadiusInput" class="shape-radius-slider" type="range" min="0" max="100" step="1" value="0" />
        </div>
      </div>
    </div>
  </div>

  <div class="reveal">
    <div id="slidesRoot" class="slides"></div>
  </div>
  <script src="/vendor/reveal/reveal.js"></script>

  <script src="/vendor/reveal/plugin/highlight.js"></script>
  <script>

  </script>

  <script src="slides.js?v=random-id-67"></script>
</body>

</html>
