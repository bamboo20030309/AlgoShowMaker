<!DOCTYPE html>
<!-- -----------------------------------------------------------------------
  AlgoShowMaker 首頁
  未登入顯示範例與驗證表單，登入後切換 deck 工作區；對話框由 home.js 依同一 state 控制。
  ------------------------------------------------------------------------ -->
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="免登入瀏覽演算法投影片，或登入個人投影片工作區" />
  <title>AlgoShowMaker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="home.css?v=cards-3" />
  <link rel="stylesheet" href="brand.css?v=site-header-2" />
  <link rel="stylesheet" href="ui-motion.css?v=1" />
  <script src="ui-motion.js?v=1" defer></script>
  <!-- 頂部列登入狀態：在 head 同步載入，頂部列之後以內嵌呼叫套用，第一次繪製就正確。 -->
  <script src="site-header.js?v=3"></script>
</head>

<body>
<!-- -----------------------------------------------------------------------
  共用頁首與帳號區
  與程式碼頁共用 .site-header（brand.css），版面完全相同；accountArea 由登入狀態顯示。
  ------------------------------------------------------------------------ -->
  <header class="app-header site-header">
    <a class="brand" href="/" aria-label="AlgoShowMaker 首頁">
      <img class="brand-mark" src="favicon.svg" width="28" height="28" alt="" aria-hidden="true" />
      <span>AlgoShowMaker</span>
    </a>
    <nav class="mode-nav" aria-label="模式">
      <a class="nav-link is-active" href="/" aria-current="page">投影片</a>
      <a class="nav-link" href="/algorithm.html">程式碼</a>
    </nav>
    <a class="site-github-link" href="https://github.com/bamboo20030309/AlgoShowMaker" target="_blank"
      rel="noopener noreferrer" title="前往 AlgoShowMaker GitHub" aria-label="前往 AlgoShowMaker GitHub（另開新視窗）">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.17.55-.39 0-.19-.01-.7-.01-1.38-2.23.49-2.7-1.09-2.7-1.09-.36-.94-.89-1.19-.89-1.19-.73-.5.05-.49.05-.49.81.06 1.23.84 1.23.84.72 1.25 1.88.89 2.34.68.07-.53.28-.89.51-1.09-1.78-.2-3.65-.9-3.65-4.02 0-.89.31-1.61.82-2.18-.08-.2-.36-1.03.08-2.15 0 0 .67-.22 2.2.83A7.5 7.5 0 0 1 8 3.94a7.5 7.5 0 0 1 2 .27c1.53-1.05 2.2-.83 2.2-.83.44 1.12.16 1.95.08 2.15.51.57.82 1.29.82 2.18 0 3.13-1.88 3.81-3.66 4.01.29.25.54.75.54 1.51 0 1.09-.01 1.97-.01 2.24 0 .22.14.47.55.39A8.04 8.04 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z" />
      </svg>
    </a>
    <div class="site-account">
      <button id="headerLoginBtn" class="site-account-btn" type="button" hidden>登入</button>
      <span id="accountArea" class="site-account-signed-in" hidden>
        <span id="accountName" class="site-account-name"></span>
        <button id="logoutBtn" class="site-account-btn" type="button">登出</button>
      </span>
    </div>
  </header>
  <script>ASMSiteHeader.apply()</script>

  <main>
<!-- -----------------------------------------------------------------------
  訪客範例與驗證表單
  範例資料可在未登入時瀏覽；登入成功後 home.js 隱藏此區並載入工作區。
  ------------------------------------------------------------------------ -->
    <section id="guestView" class="guest-view">
      <section class="guest-gallery" aria-labelledby="galleryTitle">
        <span class="eyebrow">公開投影片</span>
        <a class="gallery-workspace-link quiet-btn" href="/">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18" /></svg>
          <span>返回投影片工作區</span>
        </a>
        <h1 id="galleryTitle">演算法投影片</h1>
        <p class="gallery-intro">從分類挑選演算法，點開投影片即可觀賞，不需登入。</p>
        <nav id="galleryCategories" class="gallery-categories" aria-label="演算法分類"></nav>
        <div class="library-toolbar">
          <label class="search-field" for="gallerySearch">
            <span aria-hidden="true">⌕</span>
            <input id="gallerySearch" type="search" placeholder="搜尋演算法投影片" autocomplete="off" />
          </label>
          <span id="galleryCount" class="deck-count"></span>
        </div>
        <p id="galleryMessage" class="library-message" role="status" aria-live="polite"></p>
        <div id="galleryGrid" class="gallery-folders"></div>
      </section>
      <section class="auth-panel" aria-labelledby="authTitle">
        <div class="auth-heading">
          <span class="eyebrow">個人工作區</span>
          <h1 id="authTitle">登入 AlgoShowMaker</h1>
          <p id="authSubtitle">開啟你的投影片，繼續上次的編輯。</p>
        </div>

        <div id="authTabs" class="auth-tabs" role="tablist" aria-label="登入方式">
          <button id="loginTab" class="auth-tab is-active" type="button" role="tab" aria-selected="true">登入</button>
          <button id="registerTab" class="auth-tab" type="button" role="tab" aria-selected="false">建立帳號</button>
        </div>

        <form id="authForm" class="auth-form">
          <label for="emailInput">Email</label>
          <input id="emailInput" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />

          <div id="passwordField" class="password-field">
            <label for="passwordInput">密碼</label>
            <div class="input-with-action">
              <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="至少 8 個字元" required />
              <button id="togglePasswordBtn" class="input-icon-btn" type="button" aria-label="顯示密碼" title="顯示密碼">顯示</button>
            </div>
          </div>

          <div id="confirmPasswordField" class="password-field" hidden>
            <label for="confirmPasswordInput">確認密碼</label>
            <input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次輸入密碼" />
          </div>

          <div id="authMessage" class="form-message" role="status" aria-live="polite"></div>
          <button id="authSubmitBtn" class="primary-btn auth-submit" type="submit">登入</button>
        </form>

        <button id="forgotPasswordBtn" class="text-btn" type="button">忘記密碼？</button>
        <button id="backToLoginBtn" class="text-btn" type="button" hidden>返回登入</button>
      </section>
    </section>

<!-- -----------------------------------------------------------------------
  使用者投影片工作區
  上方分頁切換「我的投影片／範例投影片」；主區依 library layout 呈現資料夾與 deck；拖放只更新版面模型。
  ------------------------------------------------------------------------ -->
    <section id="dashboardView" class="dashboard-view" hidden>
      <div class="library">
        <div class="library-heading">
          <h1 class="visually-hidden">投影片工作區</h1>
          <div class="workspace-tabs" role="tablist" aria-label="投影片列表">
            <button id="workspaceMineTab" class="workspace-tab is-active" type="button" role="tab"
              aria-selected="true" aria-controls="workspaceMinePanel" data-workspace-tab="mine">我的投影片</button>
            <button id="workspaceExamplesTab" class="workspace-tab" type="button" role="tab"
              aria-selected="false" aria-controls="workspaceExamplesPanel" tabindex="-1"
              data-workspace-tab="examples">範例投影片</button>
          </div>
        </div>

        <div id="workspaceMinePanel" role="tabpanel" aria-labelledby="workspaceMineTab">
        <!-- 單一工具列：左側為分類（資料夾）捷徑，右側依序為份數、搜尋、新增資料夾、新增投影片。
             搜尋平時只顯示放大鏡；點開後輸入框向左展開。 -->
        <div class="library-toolbar">
          <nav id="libraryFolderNav" class="library-folder-nav" aria-label="投影片資料夾"></nav>
          <span id="deckCount" class="deck-count"></span>
          <div class="library-search" data-open="false">
            <input id="searchInput" type="search" placeholder="搜尋投影片" autocomplete="off" tabindex="-1" aria-label="搜尋投影片" />
            <button id="searchToggleBtn" class="icon-action-btn" type="button" aria-label="搜尋投影片" title="搜尋投影片"
              aria-controls="searchInput" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>
            </button>
          </div>
          <button id="createFolderBtn" class="icon-action-btn" type="button" disabled
            aria-label="新增資料夾" title="新增資料夾">
            <!-- 資料夾，右上角加號 -->
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 19H4.5A1.5 1.5 0 0 1 3 17.5v-11A1.5 1.5 0 0 1 4.5 5h4l2 2.5H13" />
              <path d="M3 9.5h11" />
              <path d="M18.5 3.5v6M15.5 6.5h6" />
              <path d="M21 12.5v5a1.5 1.5 0 0 1-1.5 1.5H13" />
            </svg>
          </button>
          <button id="createDeckBtn" class="icon-action-btn" type="button" aria-label="新增投影片" title="新增投影片">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>

        <div id="libraryMessage" class="library-message" role="status" aria-live="polite"></div>
        <div id="libraryLayoutMessage" class="library-message" role="status" aria-live="polite"></div>
        <div id="deckGrid" class="gallery-folders"></div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-preview" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h2>開始製作第一份投影片</h2>
          <p>新增後會自動儲存到你的帳號。</p>
          <button id="emptyCreateBtn" class="primary-btn" type="button">新增投影片</button>
        </div>
        </div>

        <!-- 範例分頁：home.js 在登入後把訪客視圖的 .guest-gallery 移入此處，兩種狀態共用同一份範例列表。 -->
        <div id="workspaceExamplesPanel" class="workspace-examples" role="tabpanel"
          aria-labelledby="workspaceExamplesTab" hidden></div>
      </div>
    </section>
  </main>

  <dialog id="deleteDeckDialog" class="deck-dialog t-modal" aria-labelledby="deleteDeckDialogTitle">
    <form id="deleteDeckForm">
      <div class="dialog-heading">
        <div>
          <span class="eyebrow">投影片設定</span>
          <h2 id="deleteDeckDialogTitle">刪除投影片</h2>
        </div>
        <button id="closeDeleteDeckBtn" class="icon-btn" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <p>確定要刪除「<strong id="deleteDeckName"></strong>」嗎？</p>
      <p class="category-help">刪除後無法復原。</p>
      <div id="deleteDeckMessage" class="form-message" role="status" aria-live="polite"></div>
      <div class="dialog-actions">
        <button id="confirmDeleteDeckBtn" class="danger-btn" type="submit">刪除投影片</button>
        <button id="cancelDeleteDeckBtn" class="quiet-btn" type="button">取消</button>
      </div>
    </form>
  </dialog>

  <dialog id="deleteFolderDialog" class="deck-dialog t-modal" aria-labelledby="deleteFolderTitle">
    <form id="deleteFolderForm">
      <div class="dialog-heading">
        <div><span class="eyebrow">投影片整理</span><h2 id="deleteFolderTitle">移除資料夾</h2></div>
        <button id="closeDeleteFolderBtn" class="icon-btn" type="button" aria-label="關閉">×</button>
      </div>
      <p id="deleteFolderName"></p>
      <p class="category-help">只會移除資料夾，不會刪除投影片。資料夾內的投影片會移回未分類。</p>
      <div id="deleteFolderMessage" class="form-message" role="status" aria-live="polite"></div>
      <div class="dialog-actions">
        <span class="dialog-spacer"></span>
        <button id="cancelDeleteFolderBtn" class="quiet-btn" type="button">取消</button>
        <button id="deleteFolderSubmit" class="danger-btn" type="submit">移除資料夾</button>
      </div>
    </form>
  </dialog>

<!-- -----------------------------------------------------------------------
  首頁縮圖與資料模組
  縮圖需要 Fabric 與結構 renderer，因此先載入繪圖依賴，再啟動 gallery、library 與 home 控制器。
  ------------------------------------------------------------------------ -->
  <script src="/vendor/fabric/fabric.min.js"></script>
  <script src="draw/draw_array_utils.js?v=fit-4"></script>
  <script src="draw/draw_block.js?v=lod-1"></script>
  <script src="draw/draw_array_outerframe.js?v=outerframe-1"></script>
  <script src="draw/draw_array_hintWidget.js?v=trace-4"></script>
  <script src="draw/draw_array_normal.js?v=outerframe-3"></script>
  <script src="draw/draw_array_heap.js?v=gap-1"></script>
  <script src="draw/draw_array_segment_tree.js?v=segment-label-3"></script>
  <script src="draw/draw_array_BIT.js?v=gap-1"></script>
  <script src="draw/draw_array_disk.js?v=capacity-2"></script>
  <script src="draw/draw_array_stack.js?v=gap-1"></script>
  <script src="draw/draw_array_queue.js?v=gap-1"></script>
  <script src="slide-structures.js?v=geometry-8"></script>
  <script src="deck-thumbnail.js?v=2"></script>
  <script src="trace-provenance.js?v=generation-2"></script>
  <script src="compile-session.js?v=2"></script>
  <script src="asmdeck.js?v=14"></script>
  <script src="guest-gallery.js?v=6"></script>
  <script src="deck-file-drop.js?v=2"></script>
  <script src="library-layout.js?v=3"></script>
  <script src="library-organizer.js?v=11"></script>
  <script src="home-thumbnail-cache.js?v=1"></script>
  <script src="home.js?v=cards-2"></script>
</body>

</html>
