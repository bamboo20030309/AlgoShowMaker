events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    # 與 Express 的 JSON body 上限一致，避免代理層先以預設 1 MB 拒絕投影片。
    client_max_body_size 8m;

    server {
        listen 80;

        # 1. 靜態檔案直接由 Nginx 處理 (效率最高)
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. 編譯請求轉發給 Node.js (原本 server.js 的 API)
        location = /compile {
            proxy_pass http://backend:3000; # 'backend' 對應 docker-compose 裡的服務名稱
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Trace 編輯器的分析端點也必須交由 Node.js 處理；若落入上方
        # 靜態檔案規則，POST 會被 Nginx 以 405 拒絕。
        location = /trace/analyze {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /syntax-tree {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. 如果你有其他 API (如 /api/samples)，也要轉發
        location /api {
            proxy_pass http://backend:3000;
        }

        location /vendor/reveal {
            proxy_pass http://backend:3000;
        }

        location /vendor/fabric {
            proxy_pass http://backend:3000;
        }

        location /vendor/iro {
            proxy_pass http://backend:3000;
        }
    }
}
