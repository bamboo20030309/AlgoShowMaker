# 全域連線上限；實際請求路由與容量限制在 http 區塊內設定。
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    # 與 Express 的 JSON body 上限一致，避免代理層先以預設 1 MB 拒絕投影片。
    client_max_body_size 8m;

    server {
        listen 80;

        # =====================================================================
        # 前端靜態檔：不存在的路徑回到 SPA 首頁。
        # =====================================================================
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # =====================================================================
        # 編譯與分析端點：必須保留原始 Host／來源 IP 供後端限流與記錄。
        # =====================================================================
        location = /compile {
            proxy_pass http://backend:3000; # 'backend' 對應 docker-compose 裡的服務名稱
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_cache_bypass $http_upgrade;

            # 請求可能會先在後端編譯佇列等待；需大於單次程式的 5 秒執行上限。
            # 360 秒可涵蓋 50 人展示時的短暫尖峰，逾時仍由後端工作限制負責終止。
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;

            # Trace JSON 由 Node.js 串流送出，避免 Nginx 完整緩衝大型回應後才交給瀏覽器。
            proxy_buffering off;
        }

        # Trace 編輯器的分析端點也必須交由 Node.js 處理；若落入上方
        # 靜態檔案規則，POST 會被 Nginx 以 405 拒絕。
        location = /trace/analyze {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /syntax-tree {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # 其餘 API 與由 backend 管理的第三方 runtime 資源。
        # =====================================================================
        location /api {
            proxy_pass http://backend:3000;
        }

        location /vendor/reveal {
            proxy_pass http://backend:3000;
        }

        location /vendor/fabric {
            proxy_pass http://backend:3000;
        }

        location /vendor/iro {
            proxy_pass http://backend:3000;
        }
    }
}
